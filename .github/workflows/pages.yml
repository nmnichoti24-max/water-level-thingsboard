name: WaterGuard Pro on GitHub Pages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: waterguard-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
        env:
          VITE_API_BASE_URL: https://esp32s3-water-level-monitor.vercel.app
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish approved build
        id: deployment
        uses: actions/deploy-pages@v4
